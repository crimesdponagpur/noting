/* ओळीचे नाव: त्या ओळीतील पहिला मजकूर (क्रमांक / कोड / पो.स्टे. नाव सोडून), नसल्यास विश्लेषणातील नाव */

/* कित्येक चौकटी एकदम: इंजिनमध्ये लगेच, सर्व्हरवर तुकड्यांत */
